<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="72" cy="56" r="14" fill="#0284c7" opacity="0.12"/>
  <path d="M 66 56 L 70 60 L 78 52" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="62" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="-0.3">Enterprise Centralized Reusable GitHub Actions CI/CD Architecture</text>
  
  <rect x="880" y="42" width="125" height="28" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="898" y="60" fill="#15803d" font-size="11" font-weight="700">MODULAR CI</text>
  <rect x="1015" y="42" width="125" height="28" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1025" y="60" fill="#1d4ed8" font-size="11" font-weight="700">WORKFLOW_CALL</text>

  <!-- COLUMN 1: Calling Consumer Repositories -->
  <rect x="40" y="112" width="250" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 40 122 A 10 10 0 0 1 50 112 L 280 112 A 10 10 0 0 1 290 122 L 290 156 L 40 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="141" fill="#0f172a" font-size="13" font-weight="700">1. CALLER REPOSITORIES</text>

  <rect x="56" y="174" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="200" fill="#0f172a" font-size="13" font-weight="700">Web Frontend Repos</text>
  <text x="70" y="222" fill="#64748b" font-size="11">React, Next.js, Vite</text>
  <rect x="70" y="236" width="130" height="20" rx="4" fill="#e0f2fe"/>
  <text x="78" y="250" fill="#0369a1" font-size="10" font-weight="600">uses: .../lint.yml@v1</text>

  <rect x="56" y="286" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="312" fill="#0f172a" font-size="13" font-weight="700">Microservice Backends</text>
  <text x="70" y="334" fill="#64748b" font-size="11">Go, Python FastAPI, Java</text>
  <rect x="70" y="348" width="130" height="20" rx="4" fill="#f0fdf4"/>
  <text x="78" y="362" fill="#15803d" font-size="10" font-weight="600">uses: .../docker.yml@v1</text>

  <rect x="56" y="398" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="424" fill="#0f172a" font-size="13" font-weight="700">Cloud Infrastructure</text>
  <text x="70" y="446" fill="#64748b" font-size="11">AWS, EKS, Terraform HCL</text>
  <rect x="70" y="460" width="145" height="20" rx="4" fill="#fef3c7"/>
  <text x="78" y="474" fill="#b45309" font-size="10" font-weight="600">uses: .../terraform.yml@v1</text>

  <rect x="56" y="510" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="536" fill="#0f172a" font-size="13" font-weight="700">Unified Orchestration</text>
  <text x="70" y="558" fill="#64748b" font-size="11">caller-full-pipeline.yml</text>
  <text x="70" y="578" fill="#0284c7" font-size="10" font-weight="600">Sequential DAG (needs:)</text>

  <!-- Flow Arrow 1 to 2 -->
  <line x1="290" y1="372" x2="330" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 2: Central Workflows Hub -->
  <rect x="330" y="112" width="260" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 330 122 A 10 10 0 0 1 340 112 L 580 112 A 10 10 0 0 1 590 122 L 590 156 L 330 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="348" y="141" fill="#0f172a" font-size="13" font-weight="700">2. REUSABLE WORKFLOWS HUB</text>

  <rect x="348" y="174" width="224" height="135" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="362" y="200" fill="#0369a1" font-size="14" font-weight="700">Centralized Library</text>
  <text x="362" y="222" fill="#0f172a" font-size="11">.github/workflows/*.yml</text>
  <text x="362" y="240" fill="#64748b" font-size="11">• Strictly vetted pipeline actions</text>
  <text x="362" y="258" fill="#64748b" font-size="11">• Parameterized inputs &amp; secrets</text>
  <text x="362" y="276" fill="#64748b" font-size="11">• Versioned by git tags &amp; releases</text>
  <rect x="362" y="284" width="135" height="16" rx="3" fill="#0284c7"/>
  <text x="368" y="295" fill="#ffffff" font-size="9" font-weight="700">STANDARDIZED TEMPLATES</text>

  <rect x="348" y="325" width="224" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="351" fill="#0f172a" font-size="13" font-weight="700">Secret &amp; Context Injection</text>
  <text x="362" y="373" fill="#64748b" font-size="11">Scoped credential passing</text>
  <text x="362" y="393" fill="#475569" font-size="11">• secrets: inherit or explicit</text>
  <text x="362" y="411" fill="#475569" font-size="11">• Least privilege permissions</text>
  <rect x="362" y="426" width="140" height="20" rx="4" fill="#dcfce7"/>
  <text x="370" y="440" fill="#15803d" font-size="10" font-weight="600">Zero Secret Exfiltration</text>

  <rect x="348" y="476" width="224" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="502" fill="#0f172a" font-size="13" font-weight="700">Schema Validator</text>
  <text x="362" y="524" fill="#64748b" font-size="11">validate_workflows.py</text>
  <text x="362" y="544" fill="#475569" font-size="11">• Evaluates workflow_call trigger</text>
  <text x="362" y="564" fill="#475569" font-size="11">• Enforces typed inputs</text>
  <text x="362" y="586" fill="#0284c7" font-size="10" font-weight="600">Automated Self-Audit</text>

  <!-- Flow Arrow 2 to 3 -->
  <line x1="590" y1="372" x2="630" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 3: Modular Called Pipelines -->
  <rect x="630" y="112" width="250" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 630 122 A 10 10 0 0 1 640 112 L 870 112 A 10 10 0 0 1 880 122 L 880 156 L 630 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="646" y="141" fill="#0f172a" font-size="13" font-weight="700">3. CALLED MODULES</text>

  <rect x="646" y="174" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="200" fill="#0f172a" font-size="13" font-weight="700">lint.yml</text>
  <text x="660" y="220" fill="#475569" font-size="10">• ESLint &amp; Prettier (Node)</text>
  <text x="660" y="238" fill="#475569" font-size="10">• Flake8 &amp; Ruff (Python)</text>
  <text x="660" y="256" fill="#0284c7" font-size="10" font-weight="600">• Go vet &amp; gofmt (Go)</text>

  <rect x="646" y="286" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="312" fill="#0f172a" font-size="13" font-weight="700">test.yml</text>
  <text x="660" y="332" fill="#475569" font-size="10">• Polyglot test runner</text>
  <text x="660" y="350" fill="#15803d" font-size="10" font-weight="600">• Coverage artifact generation</text>
  <text x="660" y="368" fill="#475569" font-size="10">• Pass/fail outputs</text>

  <rect x="646" y="398" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="424" fill="#0f172a" font-size="13" font-weight="700">docker.yml</text>
  <text x="660" y="444" fill="#0284c7" font-size="10" font-weight="600">• Buildx multi-arch emulation</text>
  <text x="660" y="462" fill="#dc2626" font-size="10" font-weight="600">• Trivy CVE vulnerability gate</text>
  <text x="660" y="480" fill="#475569" font-size="10">• OCI push to GHCR / ECR</text>

  <rect x="646" y="510" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="536" fill="#0f172a" font-size="13" font-weight="700">terraform.yml</text>
  <text x="660" y="556" fill="#475569" font-size="10">• fmt, validate, tflint audit</text>
  <text x="660" y="574" fill="#0284c7" font-size="10" font-weight="600">• Terraform plan generation</text>
  <text x="660" y="592" fill="#15803d" font-size="10" font-weight="600">• Gated main branch apply</text>

  <!-- Flow Arrow 3 to 4 -->
  <line x1="880" y1="372" x2="920" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 4: Downstream Outputs & Deployments -->
  <rect x="920" y="112" width="240" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 920 122 A 10 10 0 0 1 930 112 L 1150 112 A 10 10 0 0 1 1160 122 L 1160 156 L 920 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="936" y="141" fill="#0f172a" font-size="13" font-weight="700">4. EXECUTION OUTCOMES</text>

  <rect x="936" y="174" width="208" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="200" fill="#0f172a" font-size="13" font-weight="700">Unified PR Status</text>
  <text x="950" y="222" fill="#64748b" font-size="11">Granular step status checks</text>
  <text x="950" y="242" fill="#475569" font-size="11">Green checkmarks required</text>
  <text x="950" y="258" fill="#475569" font-size="11">prior to pull request merge</text>
  <text x="950" y="272" fill="#15803d" font-size="10" font-weight="600">Branch Protected</text>

  <rect x="936" y="300" width="208" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="326" fill="#0f172a" font-size="13" font-weight="700">OCI Container Image</text>
  <text x="950" y="348" fill="#64748b" font-size="11">Published to Registry</text>
  <text x="950" y="368" fill="#0284c7" font-size="11" font-weight="600">Multi-Arch linux/amd64+arm64</text>
  <text x="950" y="384" fill="#475569" font-size="10">Scanned &amp; Audited</text>

  <rect x="936" y="416" width="208" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="442" fill="#0f172a" font-size="13" font-weight="700">Infrastructure Provisioning</text>
  <text x="950" y="464" fill="#64748b" font-size="11">Terraform cloud resources</text>
  <text x="950" y="484" fill="#475569" font-size="11">Immutable state updates</text>
  <text x="950" y="498" fill="#0284c7" font-size="10" font-weight="600">Zero Configuration Drift</text>

  <rect x="936" y="528" width="208" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="554" fill="#0f172a" font-size="13" font-weight="700">Enterprise Standard</text>
  <text x="950" y="576" fill="#15803d" font-size="11" font-weight="600">DRY CI/CD Pipelines</text>
  <text x="950" y="592" fill="#64748b" font-size="10">Maintained centrally</text>
</svg>
