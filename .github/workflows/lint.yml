name: Reusable Multi-Language Lint Pipeline
description: "Centralized linting workflow for Python, Node.js, Go, YAML, and Shell scripts."

on:
  workflow_call:
    inputs:
      language:
        description: "Primary language stack: 'node', 'python', 'go', or 'multi'"
        required: false
        type: string
        default: "multi"
      node-version:
        description: "Node.js runtime version"
        required: false
        type: string
        default: "20.x"
      python-version:
        description: "Python runtime version"
        required: false
        type: string
        default: "3.12"
      go-version:
        description: "Go runtime version"
        required: false
        type: string
        default: "1.22"
      working-directory:
        description: "Root working directory for lint execution"
        required: false
        type: string
        default: "."

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Python Linting
      - name: Set up Python
        if: ${{ inputs.language == 'python' || inputs.language == 'multi' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Execute Python Linters (flake8 & ruff)
        if: ${{ inputs.language == 'python' || inputs.language == 'multi' }}
        run: |
          pip install flake8 ruff || true
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          ruff check . || true

      # Node.js Linting
      - name: Set up Node.js
        if: ${{ inputs.language == 'node' || inputs.language == 'multi' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Execute Node Linters (ESLint / Prettier)
        if: ${{ inputs.language == 'node' || inputs.language == 'multi' }}
        run: |
          if [ -f "package.json" ]; then
            npm ci --ignore-scripts || npm install
            npm run lint --if-present
          fi

      # Go Linting
      - name: Set up Go
        if: ${{ inputs.language == 'go' || inputs.language == 'multi' }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Execute Go Vet & Formatter
        if: ${{ inputs.language == 'go' || inputs.language == 'multi' }}
        run: |
          if [ -f "go.mod" ]; then
            go vet ./... || true
            test -z "$(gofmt -l .)" || echo "Code is not formatted with gofmt"
          fi
