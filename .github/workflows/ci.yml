name: Workflows Schema & Integrity Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate YAML Syntax & Workflow Schemas
        run: |
          python3 scripts/validate_workflows.py
          python3 -m unittest discover -s tests -p "test_*.py"
